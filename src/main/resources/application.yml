spring:
  application:
    name: gym-management-system
  
  datasource:
    url: jdbc:postgresql://localhost:5432/gym_db
    username: postgres
    password: fc4570091
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration/public
    default-schema: public
    baseline-on-migrate: true
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        use_sql_comments: true
        format_sql: true
        multi_tenancy: SCHEMA
        multi_tenant_connection_provider: com.gym.config.SchemaMultiTenantConnectionProvider
        multi_tenant_identifier_resolver: com.gym.config.CurrentTenantIdentifierResolver
        show-sql: false
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

jwt:
  secret: your-256-bit-secret-key-change-this-in-production-make-it-long-enough
  access-token-expiration: 3600000 # 15 minutes in milliseconds
  refresh-token-expiration: 604800000 # 7 days in milliseconds

logging:
  level:
    com.gym: DEBUG
    org.springframework.security: DEBUG
