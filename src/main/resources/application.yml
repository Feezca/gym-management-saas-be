spring:
  application:
    name: gym-management-system
  
  datasource:
    url: jdbc:postgresql://localhost:5432/gym_saas
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        multiTenancy: SCHEMA
        multi_tenant_connection_provider: com.gym.config.SchemaMultiTenantConnectionProvider
        tenant_identifier_resolver: com.gym.config.CurrentTenantIdentifierResolver
    show-sql: false
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

jwt:
  secret: your-256-bit-secret-key-change-this-in-production-make-it-long-enough
  access-token-expiration: 900000 # 15 minutes in milliseconds
  refresh-token-expiration: 604800000 # 7 days in milliseconds

logging:
  level:
    com.gym: DEBUG
    org.springframework.security: DEBUG
